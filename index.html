<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page use the whole screen, including the area behind the notch / Dynamic Island. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8eaed">
  <!-- When added to the iPhone Home Screen the page opens as a full-screen app and the map draws under the status bar. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GPS Map">
  <!-- If the map ever fails to load, delete this CSP line first to rule it out. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.ggpht.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src https: data: blob:; font-src https://fonts.gstatic.com data:; connect-src https://api.github.com https://*.googleapis.com https://*.gstatic.com https://*.google.com data: blob:; worker-src blob:; frame-src https://*.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GPS Live Map</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #e8eaed; -webkit-text-size-adjust: 100%; }
    /* Edge to edge. iPhone Safari / home-screen mode report a "100%" height that stops above the home indicator,
       so the map is sized to the LARGEST viewport (lvh) and, as a backup, by script (see fitMap) to the real screen.
       Top, bottom and sides all get map content; nothing is just shifted. */
    #map { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; }
    #mapProblem { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 2500; display: none; padding: 12px 14px; border-radius: 12px; background: #fff3cd; color: #5c3b00; font: 14px/1.4 system-ui, sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
    #mapProblem.show { display: block; }
    #mapProblem button { margin-left: 8px; }
    /* The status bar text is always white in full-screen mode; this soft shade keeps it readable on a light map.
       Its height is the top safe area, so it is invisible where there is none (desktop, Safari tab). */
    #topScrim {
      position: fixed;
      z-index: 500;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top, 0px);
      background: linear-gradient(to bottom, rgba(0, 0, 0, .40), rgba(0, 0, 0, 0));
      pointer-events: none;
    }
    .fab {
      position: relative;
      flex: 0 0 auto;
      min-width: 84px;
      min-height: 48px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: rgba(128, 128, 128, .30);
      color: #222;
      font-family: inherit;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .04em;
      box-shadow: 0 3px 14px rgba(0,0,0,.28);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .fab:disabled { opacity: .6; }
    /* One bottom row: LIVE | Layers | Street View | Measure | TRACK. Same distance from the screen edge as before. */
    #bar {
      position: fixed;
      z-index: 1000;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .fab.mid { flex: 1 1 0; min-width: 0; padding: 6px 2px; font-size: 11px; font-weight: 700; letter-spacing: 0; line-height: 1.15; overflow-wrap: normal; word-break: normal; overflow: hidden; }
    #streetButton[hidden] { display: none; }
    .fab.mid.on { background: rgba(26, 115, 232, 1); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    #liveButton, #trackButton { isolation: isolate; overflow: hidden; }
    #layersPanel {
      position: fixed;
      z-index: 1100;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 48px + 10px);
      width: min(360px, calc(100% - 24px));
      padding: 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
      font: 14px/1.3 system-ui, -apple-system, sans-serif;
      color: #222;
    }
    #layersPanel[hidden] { display: none; }
    #layersPanel h2 { margin: 2px 4px 6px; font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: .06em; }
    #layersPanel .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    #layersPanel .row:last-child { margin-bottom: 0; }
    #layersPanel button { flex: 1 1 28%; min-height: 40px; border: 1px solid #ccc; border-radius: 10px; background: #fff; font: inherit; color: inherit; }
    #layersPanel button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 700; }
    /* LIVE / TRACK switched on: red at 70% transparency (alpha .30). The text shadow keeps the label readable. */
    #liveButton.live, #trackButton.rec { background: rgba(220, 35, 45, 1); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.65); }
    /* Progress fill while TRACK is held down for the 3-second "clear footsteps" press. */
    #liveButton::before, #trackButton::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit; 
      background: rgba(255, 255, 255, .55);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform .2s ease-out;
    }
    #liveButton.holding::before, #trackButton.holding::before { transform: scaleX(1); transition: transform var(--hold, 3000ms) linear; }
    /* Orange ring: the track file could not be saved yet. It keeps retrying and the ring disappears once saved. */
    #trackButton.warn { box-shadow: 0 0 0 3px rgba(255, 170, 0, .95), 0 3px 14px rgba(0,0,0,.28); }
    #lock {
      position: fixed;
      z-index: 3000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20, 30, 40, .55);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    #lock[hidden] { display: none; }
    #lockForm {
      width: min(100%, 360px);
      padding: 22px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    #lockForm h1 { margin: 0 0 14px; font-size: 18px; }
    #lockForm label { display: block; margin-bottom: 6px; font-size: 13px; color: #444; }
    #token { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #bbb; border-radius: 10px; }
    #unlock {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #1a73e8;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }
    #unlock:disabled { opacity: .6; }
    #lockError { min-height: 1.3em; margin: 10px 0 0; font-size: 13px; color: #b3261e; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="map" aria-label="Live GPS map"></div>
  <div id="topScrim" aria-hidden="true"></div>
  <div id="mapProblem" role="alert"><span id="mapProblemText"></span><button id="mapProblemReload" type="button">Reload</button></div>
  <div id="layersPanel" hidden>
    <h2>Map type</h2>
    <div class="row">
      <button id="layerRoad" type="button" class="on">Default</button>
      <button id="layerSat" type="button">Satellite</button>
      <button id="layerTerrain" type="button">Terrain</button>
    </div>
    <h2>Map details</h2>
    <div class="row">
      <button id="layerTraffic" type="button">Traffic</button>
      <button id="layerTransit" type="button">Transit</button>
      <button id="layerBike" type="button">Cycling</button>
    </div>
  </div>
  <div id="bar">
    <button id="liveButton" class="fab" type="button" disabled aria-label="Live: tap to start or stop, hold 5 seconds for no time limit">LIVE</button>
    <button id="layersButton" class="fab mid" type="button" disabled aria-expanded="false">Layers</button>
    <button id="streetButton" class="fab mid" type="button" hidden>Exit Street View</button>
    <button id="measureButton" class="fab mid" type="button" disabled>Measure</button>
    <button id="trackButton" class="fab" type="button" disabled aria-pressed="false" title="Tap: 60 s footsteps. Hold 5 s: unlimited. Double tap: clear footsteps" aria-label="Track: tap for 60 seconds of footsteps, hold 5 seconds for unlimited recording, double tap to clear the footsteps">TRACK</button>
  </div>

  <div id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <form id="lockForm" autocomplete="off">
      <h1 id="lockTitle">GPS Live Map</h1>
      <label for="token">Access token</label>
      <input id="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button id="unlock" type="submit">Unlock</button>
      <p id="lockError" role="alert"></p>
    </form>
  </div>

  <script>
  (() => {
    "use strict";

    // These two values are NOT secrets. Without a valid token the private repo reveals nothing.
    const DATA_OWNER = "skymonk199999";
    const DATA_REPO = "gps_locator";
    const BRANCH = "main";

    const LIVE_PATH = "gps/live.json";
    const LATEST_PATH = "gps/latest.json";
    const MAPS_CONFIG_PATH = "config/maps.json";   // {"key": "<Google Maps API key>"} in the private repo
    const POLL_MS = 2000;
    const LIVE_HOLD_MS = 5000;     // hold LIVE this long: no time limit until you tap LIVE again
    const FETCH_TIMEOUT_MS = 8000;

    // TRACK: the tracker (ESP32) records the track itself and uploads it in small part files
    // gps/track3_001.json, track3_002.json, ... so recording goes on when this page is closed or reloaded.
    const TRACK_DIR = "gps";
    const TRACK_SYNC_MS = 20000;             // while recording, look for new points this often
    const FINAL_SYNC_MS = [8000, 25000];     // after a recording ends: look for the tracker's last points twice
    const ADOPT_MAX_AGE_MS = 120000;         // on load, a running LIVE/TRACK is taken over only if the tracker was seen this recently
    const TRACK_HOLD_MS = 5000;              // hold TRACK this long: recording without a time limit
    const DOUBLE_TAP_MS = 300;               // two taps on TRACK within this time clear the footsteps
    const END_GRACE_MS = 3000;               // after the tracker's own 60 s are up, the page waits this long before it ends the session
    const NO_ANSWER_MS = 90000;              // the tracker never answered: give up
    const STEP_SCALE = 1.0;                  // footstep icon size (about 20 px long)
    const STEP_TURN_MIN_M = 2;               // below this distance the walking direction is not trusted
    const POINT_FIELDS = ["gps_date", "gps_utc", "latitude", "longitude", "altitude_m",
                          "speed_kmh", "course_deg", "satellites", "hdop", "fix_quality"];

    const DEBUG = new URLSearchParams(location.search).has("debug");

    const $ = id => document.getElementById(id);
    const button = $("liveButton");
    const trackButton = $("trackButton");
    const lockEl = $("lock");
    const lockForm = $("lockForm");
    const tokenInput = $("token");
    const unlockBtn = $("unlock");
    const lockError = $("lockError");

    let token = "";                 // kept in memory only; never written to storage
    let map = null;
    let marker = null;
    let followPaused = false;       // true while you look around or inspect a place
    let liveOn = false;
    let sessionId = "";
    let startedAt = 0;
    let pollTimer = null;
    let liveUnlimited = false;
    let polling = false;
    let stopping = false;
    let busy = false;
    let fetchCount = 0;

    let recording = false;          // TRACK is on (recorded by the tracker)
    let trackName = "";             // e.g. "track3"
    let trackId = "";
    let trackUnl = false;           // the recording has no time limit (hold 5 s)
    let trackSynced = false, trackEndsAt = 0, trackStartedAt = 0, finishing = false;
    let liveSynced = false, liveEndsAt = 0;   // countdown anchored to what the tracker reports
    let recSeen = false;            // the tracker has confirmed the recording in latest.json
    let footsteps = [];             // [{ marker, left, aimed }]
    let lastStep = null;
    let lastHeading = 0;
    let partState = new Map();      // part number -> { sha, drawn }
    let syncing = false;
    let syncTimer = null;

    // ---------- status messages ----------
    // There is no on-screen status box. Messages go to the browser console
    // (errors always, progress only with ?debug in the URL) and to the LIVE button's tooltip.
    function showStatus(message, level = "notice") {
      if (level === "error") console.warn("[GPS]", message);
      else if (DEBUG) console.log("[GPS]", message);
      if (level !== "debug") button.title = message;
    }
    function clearStatus() {
      button.removeAttribute("title");
    }

    // ---------- GitHub helpers ----------
    function validName(text) { return /^[A-Za-z0-9._-]+$/.test(text) && !text.startsWith("YOUR_"); }
    function checkConfig() {
      if (!validName(DATA_OWNER) || !validName(DATA_REPO)) {
        throw new Error("Edit DATA_OWNER and DATA_REPO in index.html first.");
      }
    }
    function fileUrl(path) {
      return `https://api.github.com/repos/${encodeURIComponent(DATA_OWNER)}/${encodeURIComponent(DATA_REPO)}/contents/${path}`;
    }
    function readUrl(path, tag = "") {
      return `${fileUrl(path)}?ref=${encodeURIComponent(BRANCH)}&_=${Date.now()}${tag}`;
    }
    function headers(raw) {
      return {
        "Accept": raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
        "Authorization": `Bearer ${token}`,
        "X-GitHub-Api-Version": "2022-11-28"
      };
    }
    async function ghFetch(url, options = {}, timeoutMs = FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal,
          cache: "no-store",
          credentials: "omit",
          referrerPolicy: "no-referrer",
          mode: "cors"
        });
      } finally {
        clearTimeout(timer);
      }
    }
    async function httpError(response, what) {
      let detail = "";
      try { detail = (await response.text()).slice(0, 160); } catch (_) { /* ignore */ }
      const error = new Error(`GitHub HTTP ${response.status} for ${what}${detail ? ": " + detail : ""}`);
      error.status = response.status;
      return error;
    }
    async function readJson(path) {
      const response = await ghFetch(readUrl(path), { headers: headers(true) });
      if (!response.ok) throw await httpError(response, path);
      return JSON.parse(await response.text());
    }
    function base64Utf8(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary);
    }
    // Create or update one file. shaBox (optional) remembers the file's SHA between saves so a repeated save
    // needs one request instead of two; it is dropped whenever GitHub says it is stale.
    async function putJsonFile(path, text, message, shaBox, timeoutMs = FETCH_TIMEOUT_MS) {
      const content = base64Utf8(text);
      const maxAttempts = 5;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        let sha = shaBox && attempt === 1 ? shaBox.sha : null;
        if (!sha) {
          const getResponse = await ghFetch(readUrl(path, `-${attempt}`), { headers: headers(false) });
          if (getResponse.ok) {
            sha = (await getResponse.json()).sha || null;
            if (!sha) throw new Error(`GitHub did not return a SHA for ${path}.`);
          } else if (getResponse.status !== 404) {
            throw await httpError(getResponse, path);
          }
        }
        const body = { message, content, branch: BRANCH };
        if (sha) body.sha = sha;
        const putResponse = await ghFetch(fileUrl(path), {
          method: "PUT",
          headers: { ...headers(false), "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }, timeoutMs);
        if (putResponse.ok) {
          if (shaBox) {
            try { shaBox.sha = (await putResponse.json()).content.sha || null; } catch (_) { shaBox.sha = null; }
          }
          return;
        }
        if (shaBox) shaBox.sha = null;
        const retryable = putResponse.status === 409 || putResponse.status === 422 || putResponse.status >= 500;
        if (retryable && attempt < maxAttempts) {
          await new Promise(resolve => setTimeout(resolve, Math.min(250 * 2 ** (attempt - 1), 2500)));
          continue;
        }
        throw await httpError(putResponse, path);
      }
      throw new Error(`Could not update ${path}.`);
    }
    function writeLive(enabled, id) {
      const body = { live: enabled, id };
      if (enabled && liveUnlimited) body.unlimited = true;
      if (enabled && recording) {
        body.track = true; body.tid = trackId; body.tname = trackName;
        if (trackUnl) body.tunl = true;
      }
      const what = !enabled ? "OFF" : (liveUnlimited ? "ON (no limit)" : "ON") + (recording ? `, recording ${trackName}${trackUnl ? " (no limit)" : ""}` : "");
      return putJsonFile(LIVE_PATH, JSON.stringify(body, null, 2) + "\n", `LIVE ${what}`, null);
    }

    // ---------- errors ----------
    function describe(error) {
      if (error && error.name === "AbortError") return "Network timeout. Check your connection.";
      if (error && error.status === 401) return "Token rejected (wrong or expired).";
      if (error && (error.status === 403 || error.status === 429)) return "GitHub refused the request (token permissions or rate limit).";
      if (error && error.status === 404) return "Not found. Check the repository name, config/maps.json, and that the token can access the repository.";
      return (error && error.message) || String(error);
    }
    function relock(message) {
      token = "";
      stopLocal();                   // only this page stops looking: the tracker carries on and is taken over after unlocking
      button.disabled = true;
      trackButton.disabled = true;
      layersButton.disabled = measureButton.disabled = true;
      lockError.textContent = message;
      lockEl.hidden = false;
      tokenInput.focus();
    }
    function handleError(error) {
      if (error && error.status === 401) {
        relock("Token rejected (wrong or expired). Enter it again.");
        return;
      }
      showStatus(describe(error), "error");
    }

    // ---------- map ----------
    function setButtonState(on) {
      button.classList.toggle("live", on);
      updateLabels();
      button.setAttribute("aria-pressed", String(on));
    }
    // Keep the map exactly as tall as the real screen (covers status bar and home indicator areas).
    function fitMap() {
      const el = $("map");
      let h = window.innerHeight;
      if (window.navigator.standalone && window.screen) {
        const portrait = window.innerHeight >= window.innerWidth;
        h = Math.max(h, portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height));
      }
      el.style.height = h + "px";
    }
    window.addEventListener("resize", fitMap);
    window.addEventListener("orientationchange", () => setTimeout(fitMap, 300));
    fitMap();

    // ---------- map tools in the bottom row: Layers, Street View, Measure ----------
    const layersButton = $("layersButton");
    const streetButton = $("streetButton");
    const measureButton = $("measureButton");
    const layersPanel = $("layersPanel");
    let toolMode = "none";            // "none" | "measure"
    let measurePts = [], measureLine = null, measureDots = [];
    function fmtDistance(m) { return m >= 1000 ? (m / 1000).toFixed(2) + " km" : Math.round(m) + " m"; }
    function clearMeasure() {
      measurePts = [];
      if (measureLine) measureLine.setMap(null);
      measureLine = null;
      measureDots.forEach(d => d.setMap(null));
      measureDots = [];
    }
    function setToolMode(mode) {
      toolMode = mode;
      measureButton.classList.toggle("on", mode === "measure");
      measureButton.textContent = "Measure";
      if (mode !== "measure") clearMeasure();
      if (map) map.setOptions({ clickableIcons: mode === "none", draggableCursor: mode === "none" ? null : "crosshair" });
    }
    function setupMapTools() {
      const gmaps = google.maps;
      const layers = { traffic: null, transit: null, bike: null };
      const layerClass = { traffic: "TrafficLayer", transit: "TransitLayer", bike: "BicyclingLayer" };
      const typeButtons = { roadmap: $("layerRoad"), hybrid: $("layerSat"), terrain: $("layerTerrain") };
      for (const [type, btn] of Object.entries(typeButtons)) {
        btn.addEventListener("click", () => {
          map.setMapTypeId(type);
          for (const [t, b] of Object.entries(typeButtons)) b.classList.toggle("on", t === type);
        });
      }
      for (const [name, id] of [["traffic", "layerTraffic"], ["transit", "layerTransit"], ["bike", "layerBike"]]) {
        $(id).addEventListener("click", () => {
          if (!layers[name]) layers[name] = new gmaps[layerClass[name]]();
          const on = !$(id).classList.contains("on");
          layers[name].setMap(on ? map : null);
          $(id).classList.toggle("on", on);
        });
      }
      layersButton.addEventListener("click", () => {
        const open = layersPanel.hidden;
        layersPanel.hidden = !open;
        layersButton.classList.toggle("on", open);
        layersButton.setAttribute("aria-expanded", String(open));
      });
      const closeLayers = () => { layersPanel.hidden = true; layersButton.classList.remove("on"); layersButton.setAttribute("aria-expanded", "false"); };

      // Street View: Google's own little person (right side of the map). Drag it onto a blue street and drop it.
      // The panorama's own close button would sit under the status bar, so the bottom row gets "Exit Street View".
      const streetView = map.getStreetView();
      streetView.setOptions({ enableCloseButton: false, addressControl: true, fullscreenControl: false });
      streetView.addListener("visible_changed", () => {
        const on = streetView.getVisible();
        streetButton.hidden = !on;
        if (on) { closeLayers(); setToolMode("none"); }
      });
      streetButton.addEventListener("click", () => streetView.setVisible(false));
      measureButton.addEventListener("click", () => setToolMode(toolMode === "measure" ? "none" : "measure"));

      map.addListener("click", event => {
        closeLayers();
        if (toolMode !== "measure" || !event || !event.latLng) return;
        if (event.stop) event.stop();                 // no place popup while a tool is active
        const lat = event.latLng.lat(), lng = event.latLng.lng();
        measurePts.push({ lat, lng });
        if (!measureLine) measureLine = new gmaps.Polyline({ map, strokeColor: "#1a73e8", strokeWeight: 3, clickable: false });
        measureLine.setPath(measurePts);
        measureDots.push(new gmaps.Marker({ map, position: measurePts[measurePts.length - 1], clickable: false,
          icon: { path: gmaps.SymbolPath.CIRCLE, scale: 4, fillColor: "#fff", fillOpacity: 1, strokeColor: "#1a73e8", strokeWeight: 2 } }));
        let total = 0;
        for (let i = 1; i < measurePts.length; i++) total += distanceM(measurePts[i - 1].lat, measurePts[i - 1].lng, measurePts[i].lat, measurePts[i].lng);
        measureButton.textContent = fmtDistance(total);
      });
    }

    const MAP_IDLE_TIMEOUT_MS = 15000;
    const cspBlocked = [];
    document.addEventListener("securitypolicyviolation", e => {
      if (cspBlocked.length < 3) cspBlocked.push(`${e.violatedDirective} blocked ${String(e.blockedURI).slice(0, 80)}`);
    });
    function showMapProblem(reason) {
      const extra = cspBlocked.length ? ` [${cspBlocked.join("; ")}]` : "";
      $("mapProblemText").textContent = `Map problem: ${reason}${extra}`;
      $("mapProblem").classList.add("show");
    }
    function hideMapProblem() { $("mapProblem").classList.remove("show"); }
    $("mapProblemReload").addEventListener("click", () => location.reload());
    function loadGoogleMaps(key) {
      if (map) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timer = setTimeout(() => { script.remove(); reject(new Error("Google Maps did not load in time.")); }, 20000);
        window.gpsMapInit = () => {
          clearTimeout(timer);
          try {
            map = new google.maps.Map($("map"), {
              center: { lat: 3.1390, lng: 101.6869 },
              zoom: 12,
              maxZoom: 22,              // <-- Google allows up to 22 for satellite, 21 for roadmap
              minZoom: 1,
              // No zoom +/-, map type, fullscreen or rotate buttons; only Google's Street View person (right side).
              // Pinch / scroll / double-tap still zoom.
              disableDefaultUI: true,
              zoomControl: false,
              cameraControl: false,
              rotateControl: false,
              fullscreenControl: false,
              mapTypeControl: false,
              streetViewControl: true,
              streetViewControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
              scaleControl: false,
              // Place names and icons are clickable and open Google's own info popup.
              clickableIcons: true,
              gestureHandling: "greedy",
              keyboardShortcuts: false
            });
            // Do not stop the click (no e.stop()): Google then shows its normal place popup.
            // While you are looking at a place the map must not jump back to the tracker.
            map.addListener("click", event => { followPaused = Boolean(event && event.placeId); });
            map.addListener("dragstart", () => { followPaused = true; });
            setupMapTools();
            let idled = false;
            map.addListener("idle", () => { idled = true; hideMapProblem(); });
            const box = $("map").getBoundingClientRect();
            if (box.width < 10 || box.height < 10) showMapProblem(`map area has size ${Math.round(box.width)}x${Math.round(box.height)}.`);
            setTimeout(() => { if (!idled) showMapProblem("Google did not draw the map within 15 s (blocked request, bad key or network)."); }, MAP_IDLE_TIMEOUT_MS);
            resolve();
          } catch (error) {
            reject(error);
          }
        };
        window.gm_authFailure = () => { showStatus("Google Maps rejected the API key.", "error"); showMapProblem(`Google rejected the API key. Allow referrer ${location.origin}/* , enable Maps JavaScript API and billing.`); };
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=gpsMapInit`;
        script.async = true;
        script.defer = true;
        script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error("Could not load Google Maps.")); };
        document.head.appendChild(script);
      });
    }
    function updateMarker(lat, lng) {
      const position = { lat, lng };
      if (!marker) {
        marker = new google.maps.Marker({ map, position, title: "Current GPS location", optimized: false, zIndex: 1000 });
        // Tapping the red marker makes the map follow the tracker again.
        marker.addListener("click", () => { followPaused = false; map.panTo(marker.getPosition()); });
        map.setCenter(position);
        map.setZoom(16);
      } else {
        marker.setPosition(position);
        if (!followPaused) map.panTo(position);
      }
    }

    // ---------- footsteps ----------
    // A footprint, toe pointing up: forefoot + heel. The left foot is the mirror image of the right foot.
    const FOOT = [
      ["M", -3.6, -4.5],
      ["C", -3.8, -8.5, -1.8, -11, 0.6, -11],
      ["C", 3.4, -11, 4.6, -8, 4.2, -4.2],
      ["C", 3.9, -1.8, 3.4, 0, 2.2, 1.4],
      ["C", 1, 2.8, -1.8, 2.6, -2.8, 0.8],
      ["C", -3.4, -0.4, -3.5, -2.6, -3.6, -4.5], ["Z"],
      ["M", -2.4, 5.2],
      ["C", -2.6, 3.8, -1.4, 3.4, 0.4, 3.4],
      ["C", 2.2, 3.4, 3, 4.2, 3, 5.6],
      ["C", 3, 7.8, 1.8, 9.4, 0.2, 9.4],
      ["C", -1.4, 9.4, -2.2, 7.4, -2.4, 5.2], ["Z"]
    ];
    function footPath(mirror) {
      const sign = mirror ? -1 : 1;
      return FOOT.map(([cmd, ...nums]) => cmd + nums.map((v, i) => (i % 2 === 0 ? v * sign : v)).join(" ")).join("");
    }
    const FOOT_PATH_RIGHT = footPath(false);
    const FOOT_PATH_LEFT = footPath(true);

    function footIcon(left, rotation) {
      return {
        path: left ? FOOT_PATH_LEFT : FOOT_PATH_RIGHT,
        fillColor: "#0b57d0",
        fillOpacity: 0.92,
        strokeColor: "#ffffff",
        strokeOpacity: 0.95,
        strokeWeight: 1,
        scale: STEP_SCALE,
        rotation
      };
    }
    function distanceM(lat1, lng1, lat2, lng2) {
      const r = Math.PI / 180;
      const dx = (lng2 - lng1) * r * Math.cos(((lat1 + lat2) / 2) * r);
      const dy = (lat2 - lat1) * r;
      return Math.hypot(dx, dy) * 6371000;
    }
    function bearingDeg(lat1, lng1, lat2, lng2) {
      const r = Math.PI / 180;
      const y = Math.sin((lng2 - lng1) * r) * Math.cos(lat2 * r);
      const x = Math.cos(lat1 * r) * Math.sin(lat2 * r) - Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lng2 - lng1) * r);
      return (Math.atan2(y, x) / r + 360) % 360;
    }
    function addFootstep(lat, lng, course) {
      let heading = lastHeading;
      let known = false;
      if (lastStep && distanceM(lastStep.lat, lastStep.lng, lat, lng) >= STEP_TURN_MIN_M) {
        heading = bearingDeg(lastStep.lat, lastStep.lng, lat, lng);   // walking direction from the last two fixes
        known = true;
      } else if (!lastStep && Number.isFinite(course)) {
        heading = course;
      }
      const left = footsteps.length % 2 === 0;                       // alternate left / right foot
      // The very first print has no direction yet: turn it once the second fix shows where you went.
      if (known && footsteps.length === 1 && !footsteps[0].aimed) {
        footsteps[0].marker.setIcon(footIcon(footsteps[0].left, heading));
        footsteps[0].aimed = true;
      }
      const stepMarker = new google.maps.Marker({
        map,
        position: { lat, lng },
        icon: footIcon(left, heading),
        clickable: false,          // taps pass through to the map, so place names stay clickable
        optimized: true,
        zIndex: 1
      });
      footsteps.push({ marker: stepMarker, left, aimed: footsteps.length > 0 });
      lastStep = { lat, lng };
      lastHeading = heading;
    }
    function clearFootsteps() {
      for (const step of footsteps) step.marker.setMap(null);
      footsteps = [];
      lastStep = null;
      lastHeading = 0;
    }

    // ---------- track recording (done by the tracker) ----------
    function setTrackState(on) {
      trackButton.classList.toggle("rec", on);
      trackButton.setAttribute("aria-pressed", String(on));
    }
    async function listDir(dir) {
      const response = await ghFetch(readUrl(dir), { headers: headers(false) });
      if (response.status === 404) return [];
      if (!response.ok) throw await httpError(response, dir);
      const list = await response.json();
      return Array.isArray(list) ? list : [];
    }
    async function nextTrackName() {
      let highest = 0;
      for (const item of await listDir(TRACK_DIR)) {
        const m = /^track(\d+)(?:_\d+)?\.json$/.exec((item && item.name) || "");
        if (m) highest = Math.max(highest, parseInt(m[1], 10));
      }
      return `track${highest + 1}`;
    }
    // A saved point is [date, secs, lat_e6, lon_e6, alt_dm, spd_dkmh, crs_d, sats, hdop_d]
    function rowPosition(row) {
      if (!Array.isArray(row) || row.length < 7) return null;
      const lat = row[2] / 1e6, lng = row[3] / 1e6;
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
      return { lat, lng, course: typeof row[6] === "number" ? row[6] / 10 : NaN };
    }
    // Draws the points of one part file that are not drawn yet. Returns the position of the newest one.
    function drawNewRows(num, rows, sha) {
      const known = partState.get(num) || { sha: null, drawn: 0 };
      let newest = null;
      for (let i = known.drawn; i < rows.length; i++) {
        const p = rowPosition(rows[i]);
        if (!p) continue;
        addFootstep(p.lat, p.lng, p.course);
        newest = p;
      }
      partState.set(num, { sha: sha === undefined ? known.sha : sha, drawn: Math.max(known.drawn, rows.length) });
      return newest;
    }
    // No-limit recording: the tracker uploads in batches (part files). Read what is new.
    async function syncTrack() {
      if (!trackName || syncing || !token || !map) return;
      syncing = true;
      const name = trackName;
      try {
        const pattern = new RegExp(`^${name}_(\\d+)\\.json$`);
        const items = [];
        for (const item of await listDir(TRACK_DIR)) {
          const m = pattern.exec((item && item.name) || "");
          if (m) items.push({ num: parseInt(m[1], 10), sha: item.sha, path: item.path || `${TRACK_DIR}/${item.name}` });
        }
        items.sort((a, b) => a.num - b.num);
        for (const item of items) {
          const known = partState.get(item.num);
          if (known && known.sha === item.sha) continue;
          const data = await readJson(item.path);
          if (name !== trackName) return;               // another track was started meanwhile
          drawNewRows(item.num, data && data.track === name && data.tid === trackId && Array.isArray(data.pts) ? data.pts : [], item.sha);
        }
      } catch (error) {
        handleError(error);
      } finally {
        syncing = false;
      }
    }
    function scheduleSync(delay) {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(async () => {
        syncTimer = null;
        if (document.visibilityState !== "hidden") await syncTrack();
        if (recording && trackUnl) scheduleSync(TRACK_SYNC_MS);
      }, delay);
    }
    // After a recording ends the tracker uploads its last points within a few seconds: look twice.
    function finalSync() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => { syncTimer = null; syncTrack(); }, FINAL_SYNC_MS[0]);
      setTimeout(() => { if (!recording) syncTrack(); }, FINAL_SYNC_MS[1]);
    }
    function beginTrack(name, id, unl) {
      trackName = name;
      trackId = id;
      trackUnl = unl;
      recSeen = false;
      trackSynced = false;
      trackEndsAt = 0;
      trackStartedAt = Date.now();
      partState = new Map();
      recording = true;
      setTrackState(true);
      updateLabels();
    }
    function endTrackLocal() {
      recording = false;
      trackUnl = false;
      trackSynced = false;
      setTrackState(false);
      clearTimeout(syncTimer);
      syncTimer = null;
      updateLabels();
    }
    // The tracker ends a 60 s recording by itself. The page learns about it from the countdown, saves nothing,
    // and only tells the tracker that the recording is over (live.json without the track).
    async function finishTrack60() {
      if (!recording) return;
      endTrackLocal();
      finalSync();
      if (liveOn) await writeLive(true, sessionId);
    }
    async function stopTracking() {
      if (!recording) return;
      endTrackLocal();
      finalSync();
      if (liveOn) await writeLive(true, sessionId);      // LIVE carries on in its own mode
    }
    // unl = false: tap, 60 s, every point at once.   unl = true: hold 5 s, no limit, batches, page may be closed.
    async function startTracking(unl) {
      const name = await nextTrackName();            // before anything changes: track1, track2, ... never overwritten
      clearFootsteps();                              // the previous footsteps stay until this click
      const liveWas = liveUnlimited;
      if (unl) liveUnlimited = true;                 // a no-limit recording needs a no-limit LIVE
      beginTrack(name, newSessionId(), unl);
      try {
        if (!liveOn) await startLive();              // the first command carries the track too
        else await writeLive(true, sessionId);
      } catch (error) {
        endTrackLocal();
        liveUnlimited = liveOn ? liveWas : false;
        throw error;
      }
      setButtonState(true);
      if (unl) scheduleSync(TRACK_SYNC_MS);
    }
    async function promoteTrack() {                  // hold TRACK while a 60 s recording runs
      const liveWas = liveUnlimited;
      trackUnl = true;
      liveUnlimited = true;
      trackSynced = false;
      setButtonState(true);
      try {
        await writeLive(true, sessionId);
      } catch (error) {
        trackUnl = false;
        liveUnlimited = liveWas;
        setButtonState(true);
        throw error;
      }
      scheduleSync(TRACK_SYNC_MS);
    }

    // ---------- live session ----------
    function newSessionId() {
      const bytes = new Uint8Array(9);
      crypto.getRandomValues(bytes);
      return Date.now().toString(36) + Array.from(bytes, b => (b % 36).toString(36)).join("");
    }
    function stopLocal() {
      liveOn = false;
      clearTimeout(pollTimer);
      pollTimer = null;
      liveUnlimited = false;
      liveSynced = false;
      if (recording) { endTrackLocal(); finalSync(); }   // the tracker ends the recording when LIVE ends
      setButtonState(false);
    }
    async function stopLive(message, level = "notice") {
      if (stopping || !liveOn) return;
      stopping = true;
      const id = sessionId;
      stopLocal();
      showStatus(message, level);
      try {
        await writeLive(false, id);
      } catch (error) {
        if (error && error.status === 401) { relock("Token rejected (wrong or expired). Enter it again."); }
        else showStatus(`LIVE stopped here, but the tracker may keep running until its own limit. (${describe(error)})`, "error");
      } finally {
        stopping = false;
      }
    }
    async function startLive() {
      sessionId = newSessionId();
      showStatus("Starting LIVE…", "debug");
      await writeLive(true, sessionId);
      liveOn = true;
      followPaused = false;
      startedAt = Date.now();
      liveSynced = false;
      liveEndsAt = 0;
      fetchCount = 0;
      setButtonState(true);
      showStatus("Waiting for the tracker (it checks in every ~10 s)…");
      pollLatest();
    }

    // ---------- countdown ----------
    // The tracker enforces both 60 s limits itself and reports the seconds left ("ll" for LIVE, "tl" for TRACK) in
    // latest.json and in the track file. The page counts down from those numbers, so the countdown starts when the
    // tracker really starts (it needs up to 10 s to notice the command) and a reloaded page shows the right time.
    function secsLeft(at) { return Math.max(0, Math.ceil((at - Date.now()) / 1000)); }
    function updateLabels() {
        const liveText = !liveOn ? "LIVE" : liveUnlimited ? "∞" : liveSynced ? `${secsLeft(liveEndsAt)}s` : "…";
        const trackText = !recording ? "TRACK" : trackUnl ? "∞" : trackSynced ? `${secsLeft(trackEndsAt)}s` : "…";
      if (button.textContent !== liveText) button.textContent = liveText;
      if (trackButton.textContent !== trackText) trackButton.textContent = trackText;
    }
    // Reports can be a few seconds old: only ever move the end earlier, never later.
    function syncTimes(data) {
      if (!data) return;
      const now = Date.now();
      if (!liveUnlimited && typeof data.ll === "number" && data.ll >= 0) {
        const at = now + data.ll * 1000;
        liveEndsAt = liveSynced ? Math.min(liveEndsAt, at) : at;
        liveSynced = true;
      }
      if (recording && !trackUnl && typeof data.tl === "number" && data.tl >= 0) {
        const at = now + data.tl * 1000;
        trackEndsAt = trackSynced ? Math.min(trackEndsAt, at) : at;
        trackSynced = true;
      }
    }
    function tick() {
      updateLabels();
      const now = Date.now();
      if (liveOn && !liveUnlimited && !stopping) {
        if (liveSynced && now >= liveEndsAt + END_GRACE_MS) stopLive("60-second LIVE finished.").catch(handleError);
        else if (!liveSynced && now - startedAt > NO_ANSWER_MS) stopLive("The tracker did not answer.", "error").catch(handleError);
      }
      if (recording && !trackUnl && !finishing) {
        const over = trackSynced ? now >= trackEndsAt + END_GRACE_MS : now - trackStartedAt > NO_ANSWER_MS;
        if (over) {
          finishing = true;
          finishTrack60().catch(handleError).finally(() => { finishing = false; });
        }
      }
    }
    setInterval(tick, 500);

    function applyPart(part) {
      syncTimes(part);
      const rows = Array.isArray(part.pts) ? part.pts : [];
      const newest = drawNewRows(1, rows);              // a 60 s track is always one part file
      if (newest) updateMarker(newest.lat, newest.lng);
      return rows.length > 0;
    }
    function applyData(data, id) {
      if (!data || data.session !== id) {
        showStatus("Waiting for the tracker (it checks in every ~10 s)…");
        return;
      }
      syncTimes(data);
      if (recording && trackUnl) {
        if (data.rec === trackName) recSeen = true;
        else if (recSeen) {                              // the tracker no longer reports this recording (stopped elsewhere)
          endTrackLocal();
          finalSync();
          showStatus("Recording ended on the tracker.");
        }
      }
      const lat = data.latitude;
      const lng = data.longitude;
      if (lat === null || lng === null || data.fix_quality === 0) {
        showStatus("Tracker online. Waiting for a GPS fix…");
        return;
      }
      if (typeof lat !== "number" || typeof lng !== "number" ||
          !Number.isFinite(lat) || !Number.isFinite(lng) ||
          lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        throw new Error("latest.json contains invalid latitude/longitude.");
      }
      updateMarker(lat, lng);
      clearStatus();
      showStatus(`GPS ${lat.toFixed(6)}, ${lng.toFixed(6)} · fetches ${fetchCount}`, "debug");
    }
    async function pollLatest() {
      if (!liveOn || polling) return;
      polling = true;
      const id = sessionId;
      try {
        let fromPart = false;
        if (recording && !trackUnl && trackName) {
          // 60 s recording: the tracker writes every point to the track file (and nothing else), so read that
          let part = null;
          try {
            part = await readJson(`${TRACK_DIR}/${trackName}_001.json`);
          } catch (error) {
            if (error.status !== 404) throw error;
          }
          if (!liveOn || id !== sessionId) return;
          if (part && part.tid === trackId) fromPart = applyPart(part);
        }
        if (!fromPart) {
          let data = null;
          try {
            data = await readJson(LATEST_PATH);
          } catch (error) {
            if (error.status !== 404) throw error;   // no file yet: the tracker has not written anything
          }
          if (!liveOn || id !== sessionId) return;
          applyData(data, id);
        }
        fetchCount++;
      } catch (error) {
        if (error && (error.status === 403 || error.status === 429)) {
          await stopLive(describe(error), "error");
        } else {
          handleError(error);
        }
      } finally {
        polling = false;
        if (liveOn) pollTimer = setTimeout(pollLatest, POLL_MS);
      }
    }

    // The tracker keeps running when this page is closed or reloaded. After unlocking, take over a session that is
    // still alive: live.json says LIVE and the tracker answered recently (latest.json or the track file).
    function gpsTime(date, utc) {
      return date && utc ? Date.parse(`${date}T${utc}Z`) : NaN;
    }
    function rowTime(row) {                          // [yyyymmdd, seconds of the day, ...]
      if (!Array.isArray(row) || !(row[0] > 19000000) || !(row[1] >= 0)) return NaN;
      const d = String(row[0]);
      const s = row[1];
      const hh = String(Math.floor(s / 3600)).padStart(2, "0"), mm = String(Math.floor(s % 3600 / 60)).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
      return Date.parse(`${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}T${hh}:${mm}:${ss}Z`);
    }
    async function readOptional(path) {
      try { return await readJson(path); } catch (error) { if (error.status !== 404) throw error; return null; }
    }
    async function adoptRunning() {
      try {
        const live = await readOptional(LIVE_PATH);
        if (!live || live.live !== true || typeof live.id !== "string") return;
        const tracking = live.track === true && /^track\d{1,6}$/.test(live.tname || "") && typeof live.tid === "string";
        const trackNoLimit = tracking && live.tunl === true;
        const latest = await readOptional(LATEST_PATH);
        const part = tracking && !trackNoLimit ? await readOptional(`${TRACK_DIR}/${live.tname}_001.json`) : null;
        const latestOk = Boolean(latest && latest.session === live.id);
        const partOk = Boolean(part && part.tid === live.tid);
        if (!latestOk && !partOk) return;
        let when = NaN;
        if (latestOk) when = gpsTime(latest.gps_date, latest.gps_utc);
        if (partOk && Array.isArray(part.pts) && part.pts.length) {
          const t = rowTime(part.pts[part.pts.length - 1]);
          if (Number.isFinite(t) && !(t < when)) when = t;
        }
        if (Number.isFinite(when) && Math.abs(Date.now() - when) > ADOPT_MAX_AGE_MS) return;   // stale: not running any more
        sessionId = live.id;
        liveOn = true;
        liveUnlimited = live.unlimited === true || trackNoLimit;
        liveSynced = false;
        followPaused = false;
        startedAt = Date.now();
        fetchCount = 0;
        if (tracking) {
          clearFootsteps();
          beginTrack(live.tname, live.tid, trackNoLimit);
          recSeen = Boolean(latestOk && latest.rec === live.tname);
        }
        if (latestOk) syncTimes(latest);
        if (partOk) { applyPart(part); }
        setButtonState(true);
        if (trackNoLimit) { await syncTrack(); scheduleSync(TRACK_SYNC_MS); }   // footsteps recorded so far
        pollLatest();
      } catch (error) {
        handleError(error);
      }
    }

    // ---------- unlock ----------
    lockForm.addEventListener("submit", async event => {
      event.preventDefault();
      const value = tokenInput.value.trim();
      tokenInput.value = "";
      if (!value) return;
      unlockBtn.disabled = true;
      lockError.textContent = "Checking…";
      try {
        checkConfig();
        token = value;
        const config = await readJson(MAPS_CONFIG_PATH);
        const key = typeof config.key === "string" ? config.key.trim() : "";
        if (!/^[A-Za-z0-9_-]{30,80}$/.test(key)) throw new Error("config/maps.json does not contain a valid Maps key.");
        await loadGoogleMaps(key);
        lockError.textContent = "";
        lockEl.hidden = true;
        button.disabled = false;
        trackButton.disabled = false;
        layersButton.disabled = measureButton.disabled = false;
        await adoptRunning();                        // pick up a LIVE / TRACK that kept running while the page was closed
      } catch (error) {
        token = "";
        lockError.textContent = describe(error);
      } finally {
        unlockBtn.disabled = false;
      }
    });

    // ---------- LIVE button: tap = 60 s (countdown) / stop, hold 5 s = no time limit ----------
    let liveHoldTimer = null;
    let liveSwallowClick = false;
    button.style.setProperty("--hold", `${LIVE_HOLD_MS}ms`);
    function endLiveHold() {
      clearTimeout(liveHoldTimer);
      liveHoldTimer = null;
      button.classList.remove("holding");
    }
    async function goUnlimited() {
      if (busy || liveUnlimited) return;
      busy = true;
      try {
        liveUnlimited = true;
        if (!liveOn) {
          await startLive();
        } else {
          liveSynced = false;
          setButtonState(true);
          await writeLive(true, sessionId);          // tells the tracker there is no limit (same session)
        }
      } catch (error) {
        if (!liveOn) { liveUnlimited = false; setButtonState(false); }
        handleError(error);
      } finally {
        busy = false;
      }
    }
    button.addEventListener("pointerdown", event => {
      if (button.disabled || (event.pointerType === "mouse" && event.button !== 0)) return;
      clearTimeout(liveHoldTimer);
      liveSwallowClick = false;
      button.classList.add("holding");
      liveHoldTimer = setTimeout(() => {
        liveHoldTimer = null;
        button.classList.remove("holding");
        liveSwallowClick = true;                      // the click that follows the release must not stop LIVE
        goUnlimited();
      }, LIVE_HOLD_MS);
    });
    for (const type of ["pointerup", "pointercancel", "pointerleave"]) button.addEventListener(type, endLiveHold);
    button.addEventListener("contextmenu", event => event.preventDefault());
    button.addEventListener("click", async () => {
      if (liveSwallowClick) { liveSwallowClick = false; return; }
      if (busy) return;
      busy = true;
      button.disabled = true;
      try {
        if (!liveOn) await startLive();
        else await stopLive("LIVE stopped.");
      } catch (error) {
        handleError(error);
      } finally {
        busy = false;
        if (token) button.disabled = false;
      }
    });

    // ---------- TRACK button: tap = 60 s recording / stop, hold 5 s = no limit, double-tap = clear the footsteps ----------
    let holdTimer = null;
    let holdFired = false;
    let blockClickUntil = 0;
    let tapTimer = null;
    trackButton.style.setProperty("--hold", `${TRACK_HOLD_MS}ms`);
    function endHold() {
      clearTimeout(holdTimer);
      holdTimer = null;
      trackButton.classList.remove("holding");
      if (holdFired) {
        holdFired = false;
        blockClickUntil = Date.now() + 600;          // the click that follows the release must not toggle recording
      }
    }
    async function trackHold() {
      if (busy || (recording && trackUnl)) return;
      busy = true;
      try {
        if (recording) await promoteTrack();
        else await startTracking(true);
      } catch (error) {
        handleError(error);
      } finally {
        busy = false;
      }
    }
    async function trackTap() {
      if (recording) { stopTracking().catch(handleError); return; }
      if (busy) return;
      busy = true;
      trackButton.disabled = true;
      try {
        await startTracking(false);
      } catch (error) {
        handleError(error);
      } finally {
        busy = false;
        if (token) trackButton.disabled = false;
      }
    }
    trackButton.addEventListener("pointerdown", event => {
      if (trackButton.disabled || (event.pointerType === "mouse" && event.button !== 0)) return;
      clearTimeout(holdTimer);
      holdFired = false;
      trackButton.classList.add("holding");
      holdTimer = setTimeout(() => {
        holdTimer = null;
        holdFired = true;
        trackButton.classList.remove("holding");
        clearTimeout(tapTimer);
        tapTimer = null;
        trackHold();
      }, TRACK_HOLD_MS);
    });
    for (const type of ["pointerup", "pointercancel", "pointerleave"]) trackButton.addEventListener(type, endHold);
    trackButton.addEventListener("contextmenu", event => event.preventDefault());
    trackButton.addEventListener("click", () => {
      if (Date.now() < blockClickUntil) return;
      if (tapTimer) {                                // second tap in time: clear the footsteps (display only)
        clearTimeout(tapTimer);
        tapTimer = null;
        clearFootsteps();
        return;
      }
      tapTimer = setTimeout(() => { tapTimer = null; trackTap(); }, DOUBLE_TAP_MS);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && liveOn && !polling) {
        clearTimeout(pollTimer);
        pollLatest();
      }
      if (document.visibilityState === "visible" && recording && trackUnl) syncTrack();
    });

    setButtonState(false);
    try { checkConfig(); } catch (error) { lockError.textContent = error.message; unlockBtn.disabled = true; }
  })();
  </script>
</body>
</html>
